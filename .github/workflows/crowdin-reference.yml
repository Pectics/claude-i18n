name: "Crowdin: Sync Japanese reference"

on:
  workflow_call:
    inputs:
      snapshot_ref:
        description: Commit containing the updated upstream snapshots
        required: true
        type: string
    secrets:
      CROWDIN_PERSONAL_TOKEN:
        required: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/crowdin-reference.yml'
      - 'crowdin.ref.yml'
      - '.original/en-US*.json'
      - '.original/ja-JP*.json'

permissions:
  contents: read

concurrency:
  group: crowdin-reference
  cancel-in-progress: false

jobs:
  upload:
    name: Upload official Japanese translations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.snapshot_ref || github.sha }}

      - name: Upload Japanese reference to Crowdin
        uses: crowdin/github-action@v3
        with:
          config: crowdin.ref.yml
          crowdin_branch_name: main
          upload_sources: false
          upload_translations: true
          upload_language: ja
          import_eq_suggestions: true
          download_translations: false
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: "933715"
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
