name: "locale-update: Sync upstream locales"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: locale-update
  cancel-in-progress: true

env:
  UPDATE_BRANCH: bot/locale-update
  BASE_LOCALE: en-US
  PENDING_DIR: .pending/locale-update
  FETCH_MAX_ATTEMPTS: "5"
  FETCH_INITIAL_BACKOFF_SECONDS: "5"
  FETCH_BACKOFF_MULTIPLIER: "2"
  FETCH_JITTER_SECONDS: "1"

jobs:
  update:
    name: Sync upstream locale files
    runs-on: ubuntu-latest
    outputs:
      coverage_ready: ${{ steps.coverage.outputs.ready }}
      coverage_upstream_ref: ${{ steps.coverage.outputs.upstream_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select update branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          base_ref="${GITHUB_REF_NAME:-main}"
          git fetch origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          remote_sha="$(git ls-remote --heads origin "$UPDATE_BRANCH" | awk '{print $1}' | head -n 1)"

          pr_json="$(gh pr list --state open --limit 100 --json number,headRefName,baseRefName,url)"
          pr_number="$(
            printf '%s' "$pr_json" \
              | jq --raw-output \
                  --arg branch "$UPDATE_BRANCH" \
                  --arg base "$base_ref" \
                  '.[] | select(.headRefName == $branch and .baseRefName == $base) | .number' \
              | head -n 1
          )"

          if [ -n "$pr_number" ]; then
            git fetch origin "+refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
            git checkout -B "$UPDATE_BRANCH" "origin/$UPDATE_BRANCH"
            branch_source="open-pr"
          else
            git checkout -B "$UPDATE_BRANCH" "origin/$base_ref"
            branch_source="base"
          fi

          {
            echo "base_ref=$base_ref"
            echo "branch_name=$UPDATE_BRANCH"
            echo "branch_source=$branch_source"
            echo "remote_sha=$remote_sha"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install fetch dependency
        shell: bash
        run: python3 -m pip install --quiet curl_cffi

      - name: Fetch upstream locales and build diff
        if: steps.branch.outputs.branch_name != ''
        id: fetch
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          fetch_summary="$tmp_dir/fetch-summary.json"
          compare_summary="$tmp_dir/compare-summary.json"

          if python3 - "$BASE_LOCALE" ".original/upstream" "$tmp_dir" "$fetch_summary" <<'PY'
          import sys
          import json
          import os
          import random
          import re
          import time
          from pathlib import Path
          from curl_cffi import requests

          base_locale, original_dir, tmp_dir, summary_path = sys.argv[1:5]
          RETRYABLE_STATUS_CODES = {403, 429, 500, 502, 503, 504}
          BLOCKING_STATUS_CODES = {403, 429}
          MAX_ATTEMPTS = int(os.environ.get("FETCH_MAX_ATTEMPTS", "5"))
          INITIAL_BACKOFF_SECONDS = float(os.environ.get("FETCH_INITIAL_BACKOFF_SECONDS", "5"))
          BACKOFF_MULTIPLIER = float(os.environ.get("FETCH_BACKOFF_MULTIPLIER", "2"))
          JITTER_SECONDS = float(os.environ.get("FETCH_JITTER_SECONDS", "1"))
          SKIP_EXIT_CODE = 42

          def discover_locales(original_dir, base_locale):
              original_path = Path(original_dir)
              main_locales = set()
              dynamic_locales = set()
              locale_pattern = re.compile(r"^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$")

              for path in original_path.glob("*.json"):
                  name = path.name
                  if name.endswith(".dynamic.json"):
                      locale = name[: -len(".dynamic.json")]
                      if locale_pattern.match(locale):
                          dynamic_locales.add(locale)
                  else:
                      locale = name[: -len(".json")]
                      if locale_pattern.match(locale):
                          main_locales.add(locale)

              missing_dynamic = sorted(main_locales - dynamic_locales)
              missing_main = sorted(dynamic_locales - main_locales)
              errors = []

              if base_locale not in main_locales:
                  errors.append(f"{original_dir}: missing base locale {base_locale}.json")
              if missing_dynamic:
                  errors.append(f"{original_dir}: missing dynamic files for {', '.join(missing_dynamic)}")
              if missing_main:
                  errors.append(f"{original_dir}: missing main locale files for {', '.join(missing_main)}")

              if errors:
                  raise SystemExit("\n".join(errors))

              return [base_locale] + sorted(locale for locale in main_locales if locale != base_locale)

          locales = discover_locales(original_dir, base_locale)

          def backoff_seconds(attempt):
              base = INITIAL_BACKOFF_SECONDS * (BACKOFF_MULTIPLIER ** max(attempt - 1, 0))
              return base + random.uniform(0, JITTER_SECONDS)

          def body_preview(response):
              try:
                  text = response.text.strip()
              except Exception:
                  return ""

              text = " ".join(text.split())
              return text[:300]

          class LocaleFetchError(Exception):
              def __init__(self, message, preview=""):
                  super().__init__(message)
                  self.preview = preview

          def fetch_json(url, accept_language, is_base):
              headers = {
                  "accept": "application/json,text/plain,*/*",
                  "accept-language": accept_language,
                  "referer": "https://claude.ai/",
              }

              last_response = None
              last_error = None

              for attempt in range(1, MAX_ATTEMPTS + 1):
                  try:
                      response = requests.get(
                          url,
                          headers=headers,
                          impersonate="chrome",
                          timeout=60,
                      )
                      last_response = response

                      if response.status_code < 400:
                          content = response.content
                          if not content.lstrip().startswith((b"{", b"[")):
                              raise SystemExit(f"Fetched response from {url} does not look like JSON.")
                          return content

                      preview = body_preview(response)
                      if response.status_code in RETRYABLE_STATUS_CODES and attempt < MAX_ATTEMPTS:
                          delay = backoff_seconds(attempt)
                          print(
                              f"[retry] {url} returned HTTP {response.status_code} on attempt "
                              f"{attempt}/{MAX_ATTEMPTS}; sleeping {delay:.1f}s before retry."
                          )
                          time.sleep(delay)
                          continue

                      if response.status_code in BLOCKING_STATUS_CODES and is_base:
                          print(
                              f"::warning::Skipping upstream locale refresh because {url} still returned "
                              f"HTTP {response.status_code} after {MAX_ATTEMPTS} attempts."
                          )
                          if preview:
                              print(f"::warning::Response preview: {preview}")
                          raise SystemExit(SKIP_EXIT_CODE)

                      raise LocaleFetchError(
                          f"{url} returned HTTP {response.status_code} after {MAX_ATTEMPTS} attempts.",
                          preview,
                      )
                  except SystemExit:
                      raise
                  except LocaleFetchError:
                      raise
                  except Exception as error:
                      last_error = error
                      if attempt < MAX_ATTEMPTS:
                          delay = backoff_seconds(attempt)
                          print(
                              f"[retry] {url} failed on attempt {attempt}/{MAX_ATTEMPTS}: {error}. "
                              f"Sleeping {delay:.1f}s before retry."
                          )
                          time.sleep(delay)
                          continue
                      raise LocaleFetchError(
                          f"{url} failed after {MAX_ATTEMPTS} attempts: {error}",
                      )

              if last_response is not None:
                  raise LocaleFetchError(
                      f"{url} returned HTTP {last_response.status_code} after {MAX_ATTEMPTS} attempts.",
                      body_preview(last_response),
                  )
              if last_error is not None:
                  raise LocaleFetchError(f"{url} failed after {MAX_ATTEMPTS} attempts: {last_error}")
              raise LocaleFetchError(f"Failed to fetch {url} for an unknown reason.")

          successful_locales = []
          failed_locales = []
          warnings = []

          for locale in locales:
              is_base = locale == base_locale
              accept_language = f"{locale},{base_locale};q=0.9,en;q=0.8"
              outputs = [
                  ("main", f"https://claude.ai/i18n/{locale}.json", os.path.join(tmp_dir, f"{locale}.json")),
                  ("dynamic", f"https://claude.ai/i18n/dynamic/{locale}.json", os.path.join(tmp_dir, f"{locale}.dynamic.json")),
              ]
              locale_failed = False
              written_paths = []

              for kind, url, output in outputs:
                  try:
                      content = fetch_json(url, accept_language, is_base)
                      with open(output, "wb") as file:
                          file.write(content)
                      written_paths.append(output)
                  except SystemExit:
                      raise
                  except LocaleFetchError as error:
                      if is_base:
                          raise SystemExit(str(error))

                      locale_failed = True
                      message = f"{locale} {kind} fetch failed: {error}"
                      warnings.append(message if not error.preview else f"{message} Response preview: {error.preview}")
                      for path in written_paths:
                          try:
                              os.remove(path)
                          except FileNotFoundError:
                              pass
                      failed_locales.append(locale)
                      print(f"::warning::{message}")
                      if error.preview:
                          print(f"::warning::Response preview: {error.preview}")
                      break

              if not locale_failed:
                  successful_locales.append(locale)

          with open(summary_path, "w", encoding="utf-8") as file:
              json.dump(
                  {
                      "cachedLocales": locales,
                      "baseLocale": base_locale,
                      "successfulLocales": successful_locales,
                      "failedLocales": failed_locales,
                      "warnings": warnings,
                  },
                  file,
                  ensure_ascii=False,
                  indent=2,
              )
          PY
          then
            :
          else
            status="$?"
            if [ "$status" -eq 42 ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "skipped_due_to_upstream_block=true" >> "$GITHUB_OUTPUT"
              echo "Upstream blocked automated fetches after retries; skipping this run."
              exit 0
            fi
            exit "$status"
          fi

          python3 - "$tmp_dir" "$fetch_summary" "$compare_summary" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          tmp_dir, fetch_summary_path, compare_summary_path = sys.argv[1:4]

          with open(fetch_summary_path, "r", encoding="utf-8") as file:
              summary = json.load(file)

          base_locale = summary["baseLocale"]
          successful_locales = summary["successfulLocales"]
          changed_files = []

          for locale in successful_locales:
              for suffix in (".json", ".dynamic.json"):
                  source_path = Path(tmp_dir) / f"{locale}{suffix}"
                  target_path = Path(".original/upstream") / f"{locale}{suffix}"
                  with open(source_path, "rb") as source_file:
                      source_bytes = source_file.read()
                  target_bytes = None
                  if target_path.exists():
                      with open(target_path, "rb") as target_file:
                          target_bytes = target_file.read()
                  if target_bytes != source_bytes:
                      changed_files.append(target_path.as_posix())

          summary["changedFiles"] = changed_files
          with open(compare_summary_path, "w", encoding="utf-8") as file:
              json.dump(summary, file, ensure_ascii=False, indent=2)
          PY

          changed_count="$(python3 - "$compare_summary" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as file:
              summary = json.load(file)
          print(len(summary["changedFiles"]))
          PY
          )"

          cached_locales_json="$(python3 - "$compare_summary" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as file:
              summary = json.load(file)
          print(json.dumps(summary["cachedLocales"], ensure_ascii=False))
          PY
          )"
          successful_locales_json="$(python3 - "$compare_summary" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as file:
              summary = json.load(file)
          print(json.dumps(summary["successfulLocales"], ensure_ascii=False))
          PY
          )"
          failed_locales_json="$(python3 - "$compare_summary" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as file:
              summary = json.load(file)
          print(json.dumps(summary["failedLocales"], ensure_ascii=False))
          PY
          )"
          warnings_json="$(python3 - "$compare_summary" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as file:
              summary = json.load(file)
          print(json.dumps(summary["warnings"], ensure_ascii=False))
          PY
          )"
          base_locale="$(python3 - "$compare_summary" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as file:
              summary = json.load(file)
          print(summary["baseLocale"])
          PY
          )"
          echo "upstream_ready=true" >> "$GITHUB_OUTPUT"

          pending_created="false"
          needs_translation="false"
          diff_summary_json="{}"

          if [ "$changed_count" -gt 0 ]; then
            python3 - "$tmp_dir" "$compare_summary" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          tmp_dir, compare_summary_path = sys.argv[1:3]
          with open(compare_summary_path, "r", encoding="utf-8") as file:
              summary = json.load(file)

          for target_path in summary["changedFiles"]:
              name = Path(target_path).name
              source_path = Path(tmp_dir) / name
              shutil.copyfile(source_path, target_path)
          PY

          fi

          while IFS= read -r target_locale; do
            [ -n "$target_locale" ] || continue
            locale_diff_summary="$tmp_dir/diff-$target_locale.json"
            node scripts/locale-update/build_diff.mjs \
              --locale "$target_locale" \
              --base-locale "$base_locale" \
              --upstream-dir ".original/upstream" \
              --baseline-dir ".original/baselines/$target_locale" \
              --pending-dir "$PENDING_DIR" \
              --metadata "$compare_summary" > "$locale_diff_summary"

            locale_pending="$(jq --raw-output '.pendingCreated' "$locale_diff_summary")"
            locale_needs_translation="$(jq --raw-output '.needsTranslation' "$locale_diff_summary")"
            if [ "$locale_pending" = "true" ]; then
              pending_created="true"
            fi
            if [ "$locale_needs_translation" = "true" ]; then
              needs_translation="true"
            fi
            diff_summary_json="$(
              jq --compact-output \
                --arg locale "$target_locale" \
                --slurpfile summary "$locale_diff_summary" \
                '. + {($locale): $summary[0]}' \
                <<< "$diff_summary_json"
            )"
          done < <(jq --raw-output '.locales[]' locales.json)

          workflow_changes="$(
            git status --porcelain=v1 --untracked-files=all -- .original "$PENDING_DIR"
          )"
          if [ -z "$workflow_changes" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pending_created=$pending_created" >> "$GITHUB_OUTPUT"
            echo "needs_translation=$needs_translation" >> "$GITHUB_OUTPUT"
            echo "base_locale=$base_locale" >> "$GITHUB_OUTPUT"
            {
              echo "cached_locales_json<<EOF"
              echo "$cached_locales_json"
              echo "EOF"
              echo "successful_locales_json<<EOF"
              echo "$successful_locales_json"
              echo "EOF"
              echo "failed_locales_json<<EOF"
              echo "$failed_locales_json"
              echo "EOF"
              echo "warnings_json<<EOF"
              echo "$warnings_json"
              echo "EOF"
              echo "diff_summary_json<<EOF"
              echo "$diff_summary_json"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Fetched upstream files and per-locale pending work are current."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pending_created=$pending_created" >> "$GITHUB_OUTPUT"
          echo "needs_translation=$needs_translation" >> "$GITHUB_OUTPUT"
          echo "base_locale=$base_locale" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            while IFS= read -r file; do
              [ -n "$file" ] && echo "$file"
            done < <(python3 - "$compare_summary" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as file:
              summary = json.load(file)
          for path in summary["changedFiles"]:
              print(path)
          PY
            )
            echo "EOF"
            echo "cached_locales_json<<EOF"
            echo "$cached_locales_json"
            echo "EOF"
            echo "successful_locales_json<<EOF"
            echo "$successful_locales_json"
            echo "EOF"
            echo "failed_locales_json<<EOF"
            echo "$failed_locales_json"
            echo "EOF"
            echo "warnings_json<<EOF"
            echo "$warnings_json"
            echo "EOF"
            echo "diff_summary_json<<EOF"
            echo "$diff_summary_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push update branch
        if: steps.fetch.outputs.changed == 'true'
        id: commit
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          BRANCH_SOURCE: ${{ steps.branch.outputs.branch_source }}
          REMOTE_SHA: ${{ steps.branch.outputs.remote_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A .original
          if [ -d "$PENDING_DIR" ]; then
            git add -A "$PENDING_DIR"
          else
            git rm -r --ignore-unmatch "$PENDING_DIR"
          fi

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
            echo "No tracked files changed after upstream comparison."
            exit 0
          fi

          commit_msg="chore: Update original locale files and build diff"
          last_subject="$(git log -1 --format=%s)"
          last_author="$(git log -1 --format=%an)"

          if [ "$BRANCH_SOURCE" = "open-pr" ] \
            && [ "$last_subject" = "$commit_msg" ] \
            && [ "$last_author" = "github-actions[bot]" ]
          then
            git commit --amend --no-edit --date=now
            git push --force-with-lease origin "$BRANCH_NAME"
          else
            git commit -m "$commit_msg"
            if [ "$BRANCH_SOURCE" = "base" ] && [ -n "$REMOTE_SHA" ]; then
              git push \
                --force-with-lease="refs/heads/$BRANCH_NAME:$REMOTE_SHA" \
                --set-upstream \
                origin \
                "$BRANCH_NAME"
            else
              git push --set-upstream origin "$BRANCH_NAME"
            fi
          fi

          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.commit.outputs.committed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ steps.branch.outputs.base_ref }}
          BRANCH_NAME: ${{ steps.commit.outputs.branch_name }}
          PR_NUMBER: ${{ steps.branch.outputs.pr_number }}
          CHANGED_FILES: ${{ steps.fetch.outputs.changed_files }}
          CACHED_LOCALES_JSON: ${{ steps.fetch.outputs.cached_locales_json }}
          SUCCESSFUL_LOCALES_JSON: ${{ steps.fetch.outputs.successful_locales_json }}
          FAILED_LOCALES_JSON: ${{ steps.fetch.outputs.failed_locales_json }}
          WARNINGS_JSON: ${{ steps.fetch.outputs.warnings_json }}
          DIFF_SUMMARY_JSON: ${{ steps.fetch.outputs.diff_summary_json }}
          NEEDS_TRANSLATION: ${{ steps.fetch.outputs.needs_translation }}
          PENDING_CREATED: ${{ steps.fetch.outputs.pending_created }}
          BASE_LOCALE: ${{ steps.fetch.outputs.base_locale }}
        shell: bash
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          python3 - "$body_file" <<'PY'
          import json
          import os
          import sys

          body_path = sys.argv[1]
          changed_files = [line for line in os.environ["CHANGED_FILES"].splitlines() if line]
          cached_locales = json.loads(os.environ["CACHED_LOCALES_JSON"])
          successful_locales = json.loads(os.environ["SUCCESSFUL_LOCALES_JSON"])
          failed_locales = json.loads(os.environ["FAILED_LOCALES_JSON"])
          warnings = json.loads(os.environ["WARNINGS_JSON"])
          diff_summary = json.loads(os.environ["DIFF_SUMMARY_JSON"])
          pending_created = os.environ["PENDING_CREATED"] == "true"
          needs_translation = os.environ["NEEDS_TRANSLATION"] == "true"
          base_locale = os.environ["BASE_LOCALE"]

          lines = [
              "Automated update for upstream locale source files.",
              "",
              "Source patterns:",
              "- `https://claude.ai/i18n/{locale}.json`",
              "- `https://claude.ai/i18n/dynamic/{locale}.json`",
              "",
              f"Tracked upstream locales: `{', '.join(cached_locales)}`",
              f"Base locale for entry diff generation: `{base_locale}`",
              "",
              "Fetch status:",
              f"- Successful locales: `{', '.join(successful_locales) if successful_locales else 'none'}`",
              f"- Failed locales: `{', '.join(failed_locales) if failed_locales else 'none'}`",
              "",
              "Changed files:",
          ]

          if changed_files:
              lines.extend([f"- `{path}`" for path in changed_files])
          else:
              lines.append("- none")

          lines.extend(["", "Warnings:"])
          if warnings:
              lines.extend([f"- {warning}" for warning in warnings])
          else:
              lines.append("- none")

          lines.extend(
              [
                  "",
                  "Per-locale diff summary:",
              ]
          )
          if diff_summary:
              for locale, locale_summary in sorted(diff_summary.items()):
                  lines.append(
                      f"- `{locale}`: pending `{'yes' if locale_summary['pendingCreated'] else 'no'}`, "
                      f"translation `{'yes' if locale_summary['needsTranslation'] else 'no'}`"
                  )
                  for file_label in ("main", "dynamic"):
                      summary = locale_summary["diffSummary"][file_label]
                      lines.append(
                          f"  - `{file_label}`: add {summary['add']}, update {summary['update']}, "
                          f"remove {summary['remove']}, total {summary['total']}"
                      )
          else:
              lines.append("- No target-locale diff was generated.")

          lines.extend(
              [
                  "",
                  "Translation status:",
                  f"- Pending diff artifacts created: `{'yes' if pending_created else 'no'}`",
                  f"- Manual translation required: `{'yes' if needs_translation else 'no'}`",
              ]
          )

          with open(body_path, "w", encoding="utf-8") as file:
              file.write("\n".join(lines) + "\n")
          PY

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(
              gh pr list --state open --limit 100 --json number,headRefName,baseRefName \
                | jq --raw-output \
                    --arg branch "$BRANCH_NAME" \
                    --arg base "$BASE_REF" \
                    '.[] | select(.headRefName == $branch and .baseRefName == $base) | .number' \
                | head -n 1
            )"
          fi

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --title "chore: Update original locale files and build diff" \
              --body-file "$body_file"
            pr_url="$(gh pr view "$PR_NUMBER" --json url --jq .url)"
            echo "Updated $pr_url"
          else
            pr_url="$(gh pr create \
              --base "$BASE_REF" \
              --head "$BRANCH_NAME" \
              --title "chore: Update original locale files and build diff" \
              --body-file "$body_file")"
            echo "Created $pr_url"
          fi

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Select coverage upstream snapshot
        if: steps.fetch.outputs.upstream_ready == 'true'
        id: coverage
        env:
          BASE_REF: ${{ steps.branch.outputs.base_ref }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          BRANCH_SOURCE: ${{ steps.branch.outputs.branch_source }}
          FETCH_CHANGED: ${{ steps.fetch.outputs.changed }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        shell: bash
        run: |
          set -euo pipefail

          upstream_ref="$BASE_REF"
          if [ "$FETCH_CHANGED" = "true" ]; then
            if [ "$COMMITTED" != "true" ]; then
              echo "Upstream changed but the update branch was not committed." >&2
              exit 1
            fi
            upstream_ref="$BRANCH_NAME"
          elif [ "$BRANCH_SOURCE" = "open-pr" ]; then
            upstream_ref="$BRANCH_NAME"
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$upstream_ref" >> "$GITHUB_OUTPUT"

  coverage:
    name: Publish main coverage from latest upstream
    needs: update
    if: needs.update.outputs.coverage_ready == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/locale-update-pages.yml
    with:
      upstream_ref: ${{ needs.update.outputs.coverage_upstream_ref }}
